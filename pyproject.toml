[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "appport-services"
version = "0.1.0"
description = "AppPort Services API keys bootstrap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
appport = "appport_services.runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
