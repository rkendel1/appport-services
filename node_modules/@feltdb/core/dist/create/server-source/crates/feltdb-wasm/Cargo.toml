[package]
name = "feltdb-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
feltdb = { path = "../feltdb" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.4"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
js-sys = "0.3"
sha2 = "0.10"
web-sys = { version = "0.3", features = ["Window"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm]
name = "feltdb"

# CI and customer builds must not depend on downloading Binaryen from GitHub.
# Rust already emits an optimized release artifact; wasm-opt can be applied in
# a separately provisioned release environment when desired.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
