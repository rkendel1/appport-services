[package]
name = "feltdb"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
async-stream = "0.3"
async-trait = "0.1"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
bincode = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"
tempfile = "3"
# Host runtime for the deterministic-contract conformance suite only. It is a
# test dependency: FeltDB does not execute WASM in production.
wasmi = "2"

[[bench]]
name = "gate13_baseline"
harness = false

[[bench]]
name = "gate_13_redux"
harness = false

[[bench]]
name = "phase_7_1_2_optimization_benchmark"
harness = false

[[bench]]
name = "phase_7_1_3_crossover_analysis"
harness = false

[[bench]]
name = "gate_14a_concurrent_writer_scaling"
harness = false

[[bench]]
name = "gate_14a_rc_root_cause"
harness = false

[[bench]]
name = "gate_14a_rc2_admission_contract"
harness = false

[[bench]]
name = "gate_14a_sync_economics"
harness = false

[[bench]]
name = "gate_14a_sync1_queued_prototype"
harness = false

[[bench]]
name = "gate_14a_production_admission_revalidation"
harness = false

[[bench]]
