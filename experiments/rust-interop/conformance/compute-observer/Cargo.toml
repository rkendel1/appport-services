# EXPERIMENT: run Compute's own, unmodified AppPort/ui/1 consumer
# (compute-environment/src/service_ui.rs, compiled in via #[path]) over HTTP
# against every corpus document, to compare its verdicts with the TS oracle.
[package]
name = "compute-ui-observer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
compute-state = { path = "../../../../../compute/crates/compute-state" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
chrono = "0.4"

[workspace]
